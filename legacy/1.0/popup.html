<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Storage Manager</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header>
        <div class="title" data-i18n="extName"></div>
        <div id="tab-info">
            <div id="tab-title"></div>
            <a id="tab-url" href="#" target="_blank"></a>
            <div id="fetch-time"></div>
        </div>
        <div class="language-selector-wrapper">
            <select id="language-selector">
                <option value="en">English</option>
                <option value="ko">한국어</option>
                <option value="zh">中文</option>
                <option value="ja">日本語</option>
                <option value="es">Español</option>
                <option value="ru">Русский</option>
            </select>
        </div>
        <a href="https://linktr.ee/jelly_king" target="_blank" class="sponsor-link" data-i18n="sponsorLink"></a>
    </header>

    <div class="search-wrapper">
        <input type="search" id="search-box" data-i18n-placeholder="searchPlaceholder">
    </div>

    <main>
        <div class="list-wrapper">
            <div class="list-section" id="cookies-section">
                <h2 data-i18n="cookiesTitle"></h2>
                <div id="cookies-list" class="data-list"></div>
            </div>
            <div id="resizer"></div> <!-- Draggable resizer -->
            <div class="list-section" id="localstorage-section">
                <h2 data-i18n="localStorageTitle"></h2>
                <div id="localstorage-list" class="data-list"></div>
            </div>
        </div>
    </main>

    <footer data-i18n="footerText"></footer>

    <script src="popup.js"></script>
</body>
</html>
